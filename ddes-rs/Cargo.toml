[package]
name = "ddes-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A small Rust read/write core for Digital PCR Data Essentials Standard v1.0.0"
publish = false

[lib]
name = "ddes"

[dependencies]
camino = { version = "1", features = ["serde1"] }
csv = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
