version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: cargo
    directory: /ddes-rs
    schedule:
      interval: weekly
    groups:
      rust:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /python
    schedule:
      interval: weekly
    groups:
      python-rust:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: /python
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ['*']
        update-types: [minor, patch]
