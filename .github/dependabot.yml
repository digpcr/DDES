version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: cargo
    directory: /ddes-rs
    schedule:
      interval: weekly
    groups:
      rust:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /r/src/rust
    schedule:
      interval: weekly
    groups:
      r-rust:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /ci
    schedule:
      interval: weekly
    groups:
      browser-tests:
        patterns: ['*']
        update-types: [minor, patch]
