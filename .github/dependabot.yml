version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: cargo
    directory: /ddes-rs
    schedule:
      interval: weekly
    groups:
      rust:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /typescript
    schedule:
      interval: weekly
    groups:
      typescript-rust:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /typescript
    schedule:
      interval: weekly
    groups:
      typescript:
        patterns: ['*']
        update-types: [minor, patch]
