name: Python CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: ${{ github.event_name == 'schedule' && 'stable' || '1.88.0' }}
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings

defaults:
  run:
    shell: bash

jobs:
  python:
    name: Python (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.0'
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
      - run: uv sync --locked --python 3.12
      - name: Analysis dependencies (Linux)
        if: runner.os == 'Linux'
        run: uv sync --locked --python 3.12 --group examples
      - run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo doc --locked --no-deps
          uv run --no-sync mypy
      - name: Build wheel and replace editable installation
        run: |
          uv run --no-sync maturin build --locked --release --compatibility linux --out ../dist/python
          uv pip install --reinstall ../dist/python/*.whl
      - name: Test installed wheel
        run: |
          uv run --no-sync python -c 'import ddes, pathlib, sys; assert pathlib.Path(ddes.__file__).is_relative_to(pathlib.Path(sys.prefix))'
          uv run --no-sync python -m unittest discover -s tests -v
          uv run --no-sync python -m mypy.stubtest ddes
      - if: runner.os == 'Linux'
        run: uv run --no-sync mypy examples/clustering.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-wheel-${{ matrix.os }}
          path: dist/python/*.whl
          if-no-files-found: error
          retention-days: 14

  required:
    name: Python checks
    if: always()
    needs: [python]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            test "$result" = success || exit 1
          done
