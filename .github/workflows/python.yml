name: Python CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: ${{ github.event_name == 'schedule' && 'stable' || '1.88.0' }}
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings

defaults:
  run:
    shell: bash

jobs:
  python:
    name: Python (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.0'
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
      - run: uv sync --locked --python 3.12
      - name: Analysis dependencies (Linux)
        if: runner.os == 'Linux'
        run: uv sync --locked --python 3.12 --group examples
      - run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo doc --locked --no-deps
          uv run --no-sync mypy
      - name: Build wheel and replace editable installation
        run: |
          uv run --no-sync maturin build --locked --release --compatibility linux --out ../dist/python
          uv pip install --reinstall ../dist/python/*.whl
      - name: Test installed wheel
        run: |
          uv run --no-sync python -c 'import ddes, pathlib, sys; assert pathlib.Path(ddes.__file__).is_relative_to(pathlib.Path(sys.prefix))'
          uv run --no-sync python -m unittest discover -s tests -v
          uv run --no-sync python -m mypy.stubtest ddes
      - if: runner.os == 'Linux'
        run: uv run --no-sync mypy examples/clustering.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-wheel-${{ matrix.os }}
          path: dist/python/*.whl
          if-no-files-found: error
          retention-days: 14

  required:
    name: Python checks
    if: always()
    needs: [python]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            test "$result" = success || exit 1
          done
